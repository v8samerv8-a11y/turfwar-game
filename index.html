    <!-- 👇 لافتة البحث والكود 👇 -->
    <div id="my-blue-overlay">
        <h2>جاري البحث عن خصم<br><span style="font-size: 20px;">(Searching for opponent...)</span></h2>
        <div class="spinner"></div>
        <div class="code-box-display" id="my-room-code">----</div>
        <div style="color:#94a3b8;font-size:14px;margin-bottom:20px;">كود الغرفة</div>
        <button onclick="document.getElementById('my-blue-overlay').style.display='none'">إلغاء (Cancel)</button>
    </div>

    <!-- 👇 سكربت إظهار اللافتة واستقبال الكود 👇 -->
    <script>
      window.addEventListener('DOMContentLoaded', () => {
        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.has('autostart')) {
          setTimeout(() => {
            document.getElementById('my-blue-overlay').style.display = 'flex';
          }, 500); 
        }
      });

      // استقبال الكود الحروفي من اللعبة
      window.addEventListener('message', (event) => {
        if (event.data && event.data.type === 'ROOM_CODE_GENERATED') {
          const codeBox = document.getElementById('my-room-code');
          if (codeBox) codeBox.innerText = event.data.code;
        }
      });
    </script>
